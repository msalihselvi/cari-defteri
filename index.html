<!doctype html>
<html lang="tr">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cari">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
:root{
  --bg:#f3f4f1; --card:#ffffff; --fg:#1d221f; --muted:#68716b; --line:#dfe2dc;
  --accent:#1f5f4a; --accent-fg:#ffffff;
  --borc:#b3261e; --borc-bg:#fbe9e7; --alacak:#1b6e3c; --alacak-bg:#e3f2e8;
  --on-solid:#ffffff; --shade:rgba(20,25,22,.45); --warn-bg:#fff4d6; --warn:#7a5600;
  --hero:#1f5f4a; --hero-fg:#f4f8f5; --hero-borc:#ffb4a8; --hero-alacak:#8fd9ae;
  --f-body:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --f-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121614; --card:#1b201d; --fg:#e8ebe7; --muted:#9aa39c; --line:#2c332f;
  --accent:#5fbf98; --accent-fg:#0c1210;
  --borc:#ff8a80; --borc-bg:#3a1f1d; --alacak:#7fd6a0; --alacak-bg:#173025;
  --on-solid:#0c1210; --shade:rgba(0,0,0,.6); --hero:#17352b; --hero-fg:#e8f3ec; --warn-bg:#3a3018; --warn:#f3cf75; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 130px}
h1,h2{margin:0;font-weight:800;letter-spacing:-.01em}
h1{font-size:1.55rem} h2{font-size:1.25rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 12px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.sum small{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.sum .num{font-size:1.05rem;font-weight:600}
.sum .net{grid-column:1/-1}
.c-borc{color:var(--borc)} .c-alacak{color:var(--alacak)}
input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;font-size:16px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.list{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:10px}
.row{display:flex;align-items:center;gap:10px;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;width:100%;font:inherit;cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--bg)}
.row .main{flex:1;min-width:0}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:.8rem;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .amt{text-align:right;font-weight:600}
.row .amt small{display:block;font-family:var(--f-body);font-size:.72rem;color:var(--muted);font-weight:500}
.pill{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:99px;margin-top:3px}
.pill.borc{background:var(--borc-bg);color:var(--borc)} .pill.alacak{background:var(--alacak-bg);color:var(--alacak)} .pill.kapali{background:var(--bg);color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted);line-height:1.5}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 16px;cursor:pointer;background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.borc{background:var(--borc);color:var(--on-solid)} .btn.alacak{background:var(--alacak);color:var(--on-solid)}
.btn.danger{background:transparent;color:var(--borc);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:.9rem}
.back{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;padding:8px 0;cursor:pointer}
.head{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.head .bal{font-size:1.6rem;font-weight:600}
.head .meta{color:var(--muted);font-size:.88rem;display:flex;flex-wrap:wrap;gap:4px 14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.bar .btn{flex:1}
.sheet-bg{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.sheet label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted);font-weight:600}
.sheet p{margin:0;line-height:1.5;color:var(--muted);font-size:.92rem}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{font:inherit;font-weight:700;padding:11px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;font-size:.9rem}
.seg button.on.borc{background:var(--borc-bg);color:var(--borc);border-color:var(--borc)}
.seg button.on.alacak{background:var(--alacak-bg);color:var(--alacak);border-color:var(--alacak)}
.hero{background:var(--hero);color:var(--hero-fg);border-radius:20px;padding:16px 18px 18px;margin:4px 0 12px;display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero h1{color:var(--hero-fg)}
.hero-date{font-size:.8rem;opacity:.75;margin-bottom:2px}
.hero .icon-btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:var(--hero-fg)}
.hero-net small{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.hero-amt{font-size:2.3rem;font-weight:600;line-height:1.1;margin-top:2px;letter-spacing:-.02em}
.hero-amt span{font-size:1.3rem;opacity:.8}
.hero-hint{font-size:.85rem;opacity:.8;margin-top:4px}
.split{height:8px;border-radius:99px;background:var(--hero-alacak);overflow:hidden}
.split i{display:block;height:100%;background:var(--hero-borc);border-radius:99px 0 0 99px}
.hero-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:.82rem}
.hero-pair div{display:flex;flex-direction:column;gap:2px;opacity:.95;min-width:0}
.hero-pair b{font-size:1.02rem;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.borc{background:var(--hero-borc)} .dot.alacak{background:var(--hero-alacak)}
.month{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.month-h{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.month-g{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.month-g div{min-width:0}
.month-g small{display:block;font-size:.72rem;color:var(--muted)}
.month-g b{font-size:.92rem;font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.88rem;font-weight:600;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.chip span{color:var(--muted);font-weight:500;margin-left:2px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.on span{color:var(--bg);opacity:.7}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;letter-spacing:.02em}
.av0{background:#e3ece8;color:#1f5f4a}.av1{background:#f3e7da;color:#8a4b14}.av2{background:#e5e8f3;color:#34437a}
.av3{background:#f1e4ea;color:#7c2f50}.av4{background:#e8eedb;color:#4d5f16}.av5{background:#e2eef0;color:#20616b}
@media (prefers-color-scheme:dark){.av0{background:#1e3a30;color:#9fdcc0}.av1{background:#3d2d1b;color:#f0c08e}.av2{background:#262c45;color:#b6c2f0}
.av3{background:#3c2430;color:#f0b3cc}.av4{background:#2f3a1a;color:#c9e08e}.av5{background:#1b3639;color:#9fd8e0}}
@media (max-width:360px){.month-g{grid-template-columns:repeat(2,1fr)}.hero-amt{font-size:1.9rem}}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.qbtn{font:inherit;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.qbtn b{font-size:.95rem}
.qbtn small{color:var(--muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbtn:active{background:var(--bg)}
.vade-warn{width:100%;font:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--borc-bg);color:var(--borc);border:1px solid var(--borc);border-radius:14px;padding:11px 14px;margin-bottom:12px;line-height:1.35;font-size:.9rem;cursor:pointer}
.vade-warn.sen{background:var(--warn-bg);color:var(--warn);border-color:var(--warn);cursor:default}
.vw-go{font-weight:700;white-space:nowrap}
.chip-red{color:var(--borc);border-color:var(--borc)}
.chip-red.on{background:var(--borc);border-color:var(--borc);color:var(--on-solid)}
.pill.gec{background:var(--borc);color:var(--on-solid)}
.pill.yakin{background:var(--warn-bg);color:var(--warn)}
.vade-line{font-size:.88rem;color:var(--borc);background:var(--borc-bg);border-radius:10px;padding:8px 10px}
.vade-line.yakin{color:var(--warn);background:var(--warn-bg)}
.vade-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:-4px}
.vade-chips button{font:inherit;font-size:.85rem;font-weight:600;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.r-range{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r-range label{min-width:0}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r-grid div{background:var(--bg);border-radius:12px;padding:10px 12px;min-width:0}
.r-grid small{display:block;font-size:.75rem;color:var(--muted);margin-bottom:2px}
.r-grid b{font-size:1.05rem;font-weight:600}
.r-kasa{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700}
.r-kasa small{font-weight:500;color:var(--muted);font-size:.75rem}
.r-kasa b{font-size:1.35rem}
.r-h{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.r-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.r-list > div,.u-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.9rem}
.r-list > div:last-child,.u-row:last-child{border-bottom:0}
.r-list span{min-width:0}
.r-list small{display:block;color:var(--muted);font-size:.75rem}
.r-list .num small{display:inline;color:var(--muted)}
.u-row{width:100%;font:inherit;background:none;border-left:0;border-right:0;border-top:0;color:var(--fg);text-align:left;cursor:pointer}
.kalemler{display:flex;flex-direction:column;gap:10px}
.kalem{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.k-row{display:flex;align-items:center;gap:6px}
.k-row input{min-width:0;padding:9px 8px}
.k-miktar{flex:0 0 22%}.k-fiyat{flex:0 0 30%}
.k-x{color:var(--muted);font-weight:700}
.k-top{flex:1;text-align:right;font-weight:600;font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis}
.k-sil{flex:none;background:none;border:1px solid var(--line);color:var(--borc);border-radius:8px;width:32px;height:32px;font-size:1.1rem;cursor:pointer}
.toplam{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:1.1rem;padding:4px 2px;border-top:1px solid var(--line);padding-top:10px}
.toplam .num{font-size:1.4rem}
.big{font-family:var(--f-num);font-size:1.6rem !important;font-weight:600}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.err{color:var(--borc);font-size:.88rem;min-height:1em}
.note{font-size:.82rem;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.88rem;line-height:1.4;margin-bottom:10px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.warn .btn{flex:none}
.icon-btn{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:.9rem;z-index:30;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

<body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar"><div class="in" id="barIn"></div></div>
<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(() => {
const KEY = 'cariDefteri.v1';
const S = { cariler:[], hareketler:[], urunler:[], sonYedek:0, view:'list', cariId:null, q:'' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tl = n => { const v = Math.round(Math.abs(n)*100)/100; return (n < -0.004 ? '-' : '') + v.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}); };
const parseTL = s => { s = String(s).trim().replace(/\s|₺/g,''); if (!s) return NaN; if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,''); return Number(s); };
const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const trDate = iso => iso ? iso.split('-').reverse().join('.') : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2600); };

// ---------- kalıcı kayıt (telefonun kendi hafızası)
function load(){
  try { const d = JSON.parse(localStorage.getItem(KEY) || 'null'); if (d) { S.cariler = d.cariler||[]; S.hareketler = d.hareketler||[]; S.urunler = d.urunler||[]; S.sonYedek = d.sonYedek||0; } }
  catch(e){ toast('Kayıtlar okunamadı'); }
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify({cariler:S.cariler, hareketler:S.hareketler, urunler:S.urunler, sonYedek:S.sonYedek})); return true; }
  catch(e){ toast('Kaydedilemedi: telefon hafızası dolu olabilir'); return false; }
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

// Türler: S=Satış (cari borçlanır), L=Alış (cariye borçlanırız), T=Tahsilat (cari ödedi), O=Ödeme (cariye ödedik)
// Eski kayıtlar: B=Satış gibi, A=Tahsilat gibi sayılır.
const TUR = {
  S:{ad:'Satış', isaret:1, renk:'c-borc'}, L:{ad:'Alış', isaret:-1, renk:'c-alacak'},
  T:{ad:'Tahsilat', isaret:-1, renk:'c-alacak'}, O:{ad:'Ödeme', isaret:1, renk:'c-borc'},
  B:{ad:'Satış', isaret:1, renk:'c-borc'}, A:{ad:'Tahsilat', isaret:-1, renk:'c-alacak'}
};
const tur = h => TUR[h.tur] || TUR.S;
const sayi = n => (Math.round(n*1000)/1000).toLocaleString('tr-TR',{maximumFractionDigits:3});
function bakiye(cid){ let bak=0,son=''; for (const h of S.hareketler) if (h.cariId===cid){ bak += tur(h).isaret*h.tutar; if(h.tarih>son) son=h.tarih; } return {bak, son}; }
const gunEkle = (iso, n) => { const d = new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const gunFark = (a, b) => Math.round((new Date(a+'T12:00:00') - new Date(b+'T12:00:00'))/86400000);
// Ödemeler en eski satışı kapatır: kalan bakiye en yeni satışlardan oluşur.
// Bu ödenmemiş kısımda vadesi geçmiş / 3 gün içinde dolacak tutarları bulur.
function vadeDurum(cid){
  const {bak} = bakiye(cid);
  const sonuc = {gecikmis:0, yakin:0, enEskiVade:'', yon: bak>0.004 ? 'alacak' : bak<-0.004 ? 'borc' : ''};
  if (!sonuc.yon) return sonuc;
  const turler = sonuc.yon==='alacak' ? ['S','B'] : ['L'];
  const hs = S.hareketler.filter(h=>h.cariId===cid && turler.includes(h.tur))
    .sort((a,b)=> a.tarih===b.tarih ? (b.olusturma||0)-(a.olusturma||0) : a.tarih<b.tarih?1:-1);
  let kalan = Math.abs(bak); const bugun = today();
  for (const h of hs) {
    if (kalan <= 0.004) break;
    const pay = Math.min(kalan, h.tutar); kalan -= pay;
    if (!h.vade) continue;
    const f = gunFark(h.vade, bugun);
    if (f < 0) { sonuc.gecikmis += pay; if (!sonuc.enEskiVade || h.vade < sonuc.enEskiVade) sonuc.enEskiVade = h.vade; }
    else if (f <= 3) sonuc.yakin += pay;
  }
  return sonuc;
}
const normAd = s => String(s||'').trim().toLocaleLowerCase('tr');
function urunOgren(kalemler, t){
  const alan = (t==='L') ? 'alisFiyat' : 'satisFiyat';
  for (const k of kalemler) {
    if (!k.ad) continue;
    let u = S.urunler.find(x => normAd(x.ad)===normAd(k.ad));
    if (!u) { u = {id:uid(), ad:k.ad}; S.urunler.push(u); }
    u[alan] = k.fiyat; u.son = Date.now();
  }
}
function durum(bak){ return bak>0.004 ? ['borc','Borçlu'] : bak<-0.004 ? ['alacak','Alacaklı'] : ['kapali','Kapalı']; }

function render(){
  if (S.view==='detail' && !S.cariler.find(c=>c.id===S.cariId)) S.view='list';
  S.view==='list' ? renderList($('#app')) : renderDetail($('#app'));
}

function renderList(app){
  let alacak=0, borc=0;
  const rows = S.cariler.map(c => ({...c, ...bakiye(c.id)}));
  rows.forEach(r => { if (r.bak>0) alacak+=r.bak; else borc-=r.bak; });
  const net = alacak-borc;
  const ay = today().slice(0,7);
  const ayAdi = new Date().toLocaleDateString('tr-TR',{month:'long'});
  const buAy = {S:0,L:0,T:0,O:0};
  for (const h of S.hareketler) if ((h.tarih||'').startsWith(ay)) { const k = ({B:'S',A:'T'})[h.tur]||h.tur; if (k in buAy) buAy[k]+=h.tutar; }
  const q = S.q.toLocaleLowerCase('tr');
  const f = S.filtre || 'tum';
  const sayac = {tum:rows.length, borclu:rows.filter(r=>r.bak>0.004).length, alacakli:rows.filter(r=>r.bak<-0.004).length};
  const shown = rows.filter(r => (!q || (r.ad||'').toLocaleLowerCase('tr').includes(q) || (r.telefon||'').includes(q))
                      && (f==='tum' || (f==='borclu' && r.bak>0.004) || (f==='alacakli' && r.bak<-0.004)))
                    .sort(f==='tum' ? (a,b) => (b.son||'').localeCompare(a.son||'') || (a.ad||'').localeCompare(b.ad||'','tr')
                                    : (a,b) => Math.abs(b.bak)-Math.abs(a.bak));
  const gun = S.sonYedek ? Math.floor((Date.now()-S.sonYedek)/86400000) : null;
  const yedekUyari = S.hareketler.length > 0 && (gun===null || gun>=7);
  const oran = (alacak+borc) > 0 ? Math.round(alacak/(alacak+borc)*100) : 50;
  const vd = {}; rows.forEach(r => vd[r.id] = vadeDurum(r.id));
  const vadeGec = rows.filter(r => vd[r.id].yon==='alacak' && vd[r.id].gecikmis>0.004);
  const vadeGecTop = vadeGec.reduce((s,r)=>s+vd[r.id].gecikmis,0);
  const vadeBorc = rows.filter(r => vd[r.id].yon==='borc' && vd[r.id].gecikmis>0.004);
  const vadeBorcTop = vadeBorc.reduce((s,r)=>s+vd[r.id].gecikmis,0);
  if (f==='vade') { shown.length = 0; rows.filter(r=>vd[r.id].gecikmis>0.004).sort((a,b)=>vd[b.id].gecikmis-vd[a.id].gecikmis).forEach(r=>shown.push(r)); }
  const harf = ad => (ad||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toLocaleUpperCase('tr');
  const renkNo = id => [...String(id)].reduce((s,c)=>s+c.charCodeAt(0),0) % 6;
  const tarihStr = new Date().toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
  app.innerHTML = `
    <header class="hero">
      <div class="hero-top"><div><div class="hero-date">${tarihStr}</div><h1>Cari Defteri</h1></div></div>
      <div class="hero-net">
        <small>Net durum</small>
        <div class="hero-amt num">${net<-0.004?'−':''}${tl(Math.abs(net))} <span>₺</span></div>
        <div class="hero-hint">${net>0.004?'Piyasadan alacağınız borcunuzdan fazla':net<-0.004?'Borcunuz alacağınızdan fazla':'Alacak ve borç dengede'}</div>
      </div>
      <div class="split" aria-hidden="true"><i style="width:${oran}%"></i></div>
      <div class="hero-pair">
        <div><span class="dot borc"></span>Alacağınız<b class="num">${tl(alacak)} ₺</b></div>
        <div><span class="dot alacak"></span>Borcunuz<b class="num">${tl(borc)} ₺</b></div>
      </div>
    </header>
    <nav class="quick">
      <button class="qbtn" id="q-rapor"><b>Rapor</b><small>günlük · aylık</small></button>
      <button class="qbtn" id="q-urun"><b>Ürünler</b><small>${S.urunler.length} kayıtlı</small></button>
      <button class="qbtn" id="menu"><b>Yedek</b><small>${S.sonYedek ? new Date(S.sonYedek).toLocaleDateString('tr-TR',{day:'numeric',month:'short'}) : 'alınmadı'}</small></button>
    </nav>
    ${vadeGec.length ? `<button class="vade-warn" id="vadeFiltre"><span><b>Vadesi geçen ${vadeGec.length} cari</b><br>Toplam ${tl(vadeGecTop)} ₺ gecikmiş alacak</span><span class="vw-go">Göster ›</span></button>` : ''}
    ${vadeBorc.length ? `<div class="vade-warn sen"><span><b>Ödemeniz gecikti: ${vadeBorc.length} cari</b><br>Toplam ${tl(vadeBorcTop)} ₺</span></div>` : ''}
    ${yedekUyari ? `<div class="warn"><span>${gun===null?'Henüz yedek almadınız.':`Son yedek ${gun} gün önce.`} Telefon kaybolursa kayıtlar gider.</span><button class="btn sm" id="quickBackup">Yedek al</button></div>` : ''}
    <section class="month">
      <div class="month-h">${ayAdi.charAt(0).toLocaleUpperCase('tr')+ayAdi.slice(1)} ayı</div>
      <div class="month-g">
        <div><small>Satış</small><b class="num c-borc">${tl(buAy.S)}</b></div>
        <div><small>Alış</small><b class="num c-alacak">${tl(buAy.L)}</b></div>
        <div><small>Tahsilat</small><b class="num">${tl(buAy.T)}</b></div>
        <div><small>Ödeme</small><b class="num">${tl(buAy.O)}</b></div>
      </div>
    </section>
    <div class="search"><input id="q" type="search" placeholder="Cari ara (ad veya telefon)" value="${esc(S.q)}" autocomplete="off"></div>
    <div class="chips" role="tablist">
      <button class="chip ${f==='tum'?'on':''}" data-f="tum">Tümü <span>${sayac.tum}</span></button>
      <button class="chip ${f==='borclu'?'on':''}" data-f="borclu">Borçlular <span>${sayac.borclu}</span></button>
      <button class="chip ${f==='alacakli'?'on':''}" data-f="alacakli">Alacaklılar <span>${sayac.alacakli}</span></button>
      ${vadeGec.length+vadeBorc.length ? `<button class="chip ${f==='vade'?'on':''} chip-red" data-f="vade">Vadesi geçen <span>${vadeGec.length+vadeBorc.length}</span></button>` : ''}
    </div>
    <div class="list">
      ${shown.length ? shown.map(r => { const [cls,lbl]=durum(r.bak); return `
        <button class="row" data-id="${esc(r.id)}">
          <span class="av av${renkNo(r.id)}">${esc(harf(r.ad))}</span>
          <div class="main"><div class="name">${esc(r.ad)}</div><div class="sub">${r.son?`Son işlem ${trDate(r.son)}`:'Henüz işlem yok'}${r.telefon?' · '+esc(r.telefon):''}</div></div>
          <div class="amt"><div class="num ${cls==='borc'?'c-borc':cls==='alacak'?'c-alacak':''}">${tl(Math.abs(r.bak))} ₺</div>${vd[r.id].gecikmis>0.004 ? `<span class="pill gec">${gunFark(today(), vd[r.id].enEskiVade)} gün gecikti</span>` : vd[r.id].yakin>0.004 ? `<span class="pill yakin">Vade yakın</span>` : `<span class="pill ${cls}">${lbl}</span>`}</div>
        </button>`}).join('') :
        `<div class="empty">${S.cariler.length ? 'Bu filtreye uyan cari yok.' : '<b>Henüz cari yok.</b><br>Alttaki <b>Yeni Cari</b> ile ilk müşteri veya tedarikçinizi ekleyin.'}</div>`}
    </div>
    <p class="note">Kırmızı: cari size borçlu · Yeşil: siz cariye borçlusunuz.<br>Kayıtlar yalnızca bu telefonda durur. Ara sıra <b>Yedek</b> alın.</p>`;
  $('#q').addEventListener('input', e => { S.q = e.target.value; const pos = e.target.selectionStart; renderList(app); const i=$('#q'); i.focus(); i.setSelectionRange(pos,pos); });
  app.querySelectorAll('.chip').forEach(b => b.onclick = () => { S.filtre = b.dataset.f; renderList(app); });
  app.querySelectorAll('.row[data-id]').forEach(b => b.onclick = () => { S.view='detail'; S.cariId=b.dataset.id; window.scrollTo(0,0); render(); });
  $('#menu').onclick = yedekSheet;
  if ($('#quickBackup')) $('#quickBackup').onclick = yedekAl;
  $('#q-rapor').onclick = () => raporSheet();
  $('#q-urun').onclick = () => urunlerSheet();
  if ($('#vadeFiltre')) $('#vadeFiltre').onclick = () => { S.filtre='vade'; renderList(app); };
  bar([['+ Yeni Cari','btn', () => cariSheet()]]);
}

function renderDetail(app){
  const c = S.cariler.find(x=>x.id===S.cariId);
  const hs = S.hareketler.filter(h=>h.cariId===c.id).sort((a,b)=> a.tarih===b.tarih ? (a.olusturma||0)-(b.olusturma||0) : a.tarih<b.tarih?-1:1);
  let run=0; const withRun = hs.map(h => { run += tur(h).isaret*h.tutar; return {...h, run}; });
  const kalemOzet = h => (h.kalemler||[]).map(k => `${esc(k.ad||'')} ${sayi(k.miktar)} × ${tl(k.fiyat)}`.trim()).join(' · ');
  const [cls,lbl] = durum(run);
  const vdc = vadeDurum(c.id);
  app.innerHTML = `
    <button class="back" id="back">‹ Cariler</button>
    <div class="head">
      <h2>${esc(c.ad)}</h2>
      <div class="meta">${c.telefon?`<span>☎ ${esc(c.telefon)}</span>`:''}${c.adres?`<span>${esc(c.adres)}</span>`:''}</div>
      ${c.notlar?`<div class="meta">${esc(c.notlar)}</div>`:''}
      <div><span class="bal num ${cls==='borc'?'c-borc':cls==='alacak'?'c-alacak':''}">${tl(Math.abs(run))} ₺</span> <span class="pill ${cls}">${lbl}</span></div>
      ${vdc.gecikmis>0.004 ? `<div class="vade-line">${vdc.yon==='alacak'?'Vadesi geçen alacak':'Vadesi geçen borcunuz'}: <b class="num">${tl(vdc.gecikmis)} ₺</b> · ${gunFark(today(), vdc.enEskiVade)} gün gecikti</div>` : vdc.yakin>0.004 ? `<div class="vade-line yakin">3 gün içinde vadesi dolacak: <b class="num">${tl(vdc.yakin)} ₺</b></div>` : ''}
      <div class="tools">
        <button class="btn ghost sm" id="edit">Cariyi düzenle</button>
        <button class="btn ghost sm" id="share">Ekstre gönder</button>
        <button class="btn ghost sm" id="para">Para al / ver</button>
      </div>
    </div>
    <div class="list">
      ${withRun.length ? withRun.slice().reverse().map(h => `
        <button class="row" data-h="${esc(h.id)}">
          <div class="main"><div class="name">${esc(h.aciklama || kalemOzet(h) || tur(h).ad)}</div><div class="sub">${trDate(h.tarih)} · <span class="${tur(h).renk}">${tur(h).ad}</span>${h.aciklama && kalemOzet(h) ? ' · '+kalemOzet(h) : ''}${h.vade ? ` · <span class="${h.vade<today()?'c-borc':''}">vade ${trDate(h.vade)}</span>` : ''}</div></div>
          <div class="amt"><div class="num ${tur(h).renk}">${tur(h).isaret>0?'+':'−'}${tl(h.tutar)}</div><small class="num">bakiye ${tl(h.run)}</small></div>
        </button>`).join('') : `<div class="empty">Bu caride hareket yok.<br>Sattığınızda <b>Satış</b>, aldığınızda <b>Alış</b> girin.<br>Para alıp verdiğinizde <b>Para al / ver</b>'i kullanın.</div>`}
    </div>`;
  $('#back').onclick = () => { S.view='list'; render(); };
  $('#edit').onclick = () => cariSheet(c);
  $('#share').onclick = () => ekstreGonder(c, withRun);
  $('#para').onclick = () => hareketSheet(c.id,null,'T');
  app.querySelectorAll('[data-h]').forEach(b => b.onclick = () => hareketSheet(c.id, S.hareketler.find(h=>h.id===b.dataset.h)));
  bar([['+ Satış','btn borc', () => hareketSheet(c.id,null,'S')], ['+ Alış','btn alacak', () => hareketSheet(c.id,null,'L')]]);
}

function bar(btns){
  const i = $('#barIn'); i.innerHTML='';
  btns.forEach(([t,cls,fn]) => { const x=document.createElement('button'); x.className=cls; x.textContent=t; x.onclick=fn; i.appendChild(x); });
}

function sheet(html, onMount){
  const host = $('#sheetHost');
  host.innerHTML = `<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const close = () => { host.innerHTML=''; render(); };
  $('#sbg').addEventListener('click', e => { if (e.target.id==='sbg') close(); });
  onMount(close);
}

function cariSheet(c){
  sheet(`
    <h2>${c?'Cariyi düzenle':'Yeni cari'}</h2>
    <label>Ad / Unvan<input id="f-ad" value="${esc(c?.ad)}" autocomplete="off"></label>
    <label>Telefon<input id="f-tel" type="tel" value="${esc(c?.telefon)}"></label>
    <label>Adres<input id="f-adres" value="${esc(c?.adres)}"></label>
    <label>Not<textarea id="f-not" rows="2">${esc(c?.notlar)}</textarea></label>
    <div class="err" id="f-err"></div>
    <div class="actions"><button class="btn ghost" id="f-cancel">Vazgeç</button><button class="btn" id="f-save">Kaydet</button></div>
    ${c?`<div class="actions" id="delWrap"><button class="btn danger" id="f-del">Cariyi sil</button></div>`:''}`, close => {
    if (!c) $('#f-ad').focus();
    $('#f-cancel').onclick = close;
    $('#f-save').onclick = () => {
      const ad = $('#f-ad').value.trim();
      if (!ad) { $('#f-err').textContent='Ad / unvan yazın.'; return; }
      const body = { ad, telefon:$('#f-tel').value.trim(), adres:$('#f-adres').value.trim(), notlar:$('#f-not').value.trim() };
      if (c) Object.assign(c, body);
      else { const n = {id:uid(), ...body, olusturma:Date.now()}; S.cariler.push(n); S.view='detail'; S.cariId=n.id; }
      if (save()) { close(); toast('Kaydedildi'); }
    };
    if (c) $('#f-del').onclick = () => {
      const n = S.hareketler.filter(h=>h.cariId===c.id).length;
      $('#delWrap').innerHTML = `<div style="width:100%;display:flex;flex-direction:column;gap:8px"><div class="err">“${esc(c.ad)}” ve ${n} hareketi silinecek. Geri alınamaz.</div><button class="btn borc" id="f-del2">Evet, sil</button></div>`;
      $('#f-del2').onclick = () => {
        S.hareketler = S.hareketler.filter(h=>h.cariId!==c.id);
        S.cariler = S.cariler.filter(x=>x.id!==c.id);
        S.view='list'; if (save()) { close(); toast('Cari silindi'); }
      };
    };
  });
}

function hareketSheet(cariId, h, yeniTur){
  // Eski türleri yeni karşılıklarına çevir
  let t = h ? ({B:'S', A:'T'}[h.tur] || h.tur) : yeniTur;
  const malMi = x => x==='S' || x==='L';
  const grup = malMi(t) ? 'mal' : 'para';
  let kalemler = h && h.kalemler && h.kalemler.length ? h.kalemler.map(k=>({...k}))
               : (h && malMi(t) ? [{ad:h.aciklama||'', miktar:1, fiyat:h.tutar}] : [{ad:'', miktar:'', fiyat:''}]);
  const segHtml = grup==='mal'
    ? `<button class="borc" data-t="S">Satış<br><small style="font-weight:500">siz sattınız</small></button><button class="alacak" data-t="L">Alış<br><small style="font-weight:500">siz aldınız</small></button>`
    : `<button class="alacak" data-t="T">Tahsilat<br><small style="font-weight:500">para aldınız</small></button><button class="borc" data-t="O">Ödeme<br><small style="font-weight:500">para verdiniz</small></button>`;
  sheet(`
    <h2>${h ? 'Hareketi düzenle' : grup==='mal' ? 'Yeni satış / alış' : 'Para al / ver'}</h2>
    <div class="seg">${segHtml}</div>
    ${grup==='mal' ? `
      <div id="kalemler" class="kalemler"></div>
      <button class="btn ghost sm" id="k-ekle">+ Kalem ekle</button>
      <div class="toplam"><span>Toplam</span><span class="num" id="k-toplam">0,00 ₺</span></div>
      <datalist id="urunList">${S.urunler.slice().sort((a,b)=>(b.son||0)-(a.son||0)).map(u=>`<option value="${esc(u.ad)}"></option>`).join('')}</datalist>
      <label>Vade (isteğe bağlı)<input id="f-vade" type="date" value="${h?.vade||''}"></label>
      <div class="vade-chips"><button type="button" data-g="0">Peşin</button><button type="button" data-g="7">7 gün</button><button type="button" data-g="15">15 gün</button><button type="button" data-g="30">30 gün</button><button type="button" data-g="60">60 gün</button></div>
      <label>Not (isteğe bağlı)<input id="f-acik" value="${esc(h?.aciklama && h.kalemler ? h.aciklama : '')}" placeholder="örn. fatura no, teslim yeri" autocomplete="off"></label>`
    : `
      <label>Tutar (₺)<input id="f-tutar" class="big" inputmode="decimal" placeholder="0,00" value="${h?tl(h.tutar):''}" autocomplete="off"></label>
      <label>Açıklama<input id="f-acik" value="${esc(h?.aciklama)}" placeholder="örn. nakit, havale" autocomplete="off"></label>`}
    <label>Tarih<input id="f-tarih" type="date" value="${h?h.tarih:today()}"></label>
    <div class="err" id="f-err"></div>
    <div class="actions"><button class="btn ghost" id="f-cancel">Vazgeç</button><button class="btn" id="f-save">Kaydet</button></div>
    ${h?`<div class="actions" id="delWrap"><button class="btn danger" id="f-del">Hareketi sil</button></div>`:''}`, close => {
    const seg = () => document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.t===t));
    document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { t=b.dataset.t; seg(); }); seg();

    const satirTop = k => { const m = parseTL(k.miktar), f = parseTL(k.fiyat); return (m>0 && f>=0) ? m*f : 0; };
    const toplam = () => kalemler.reduce((s,k)=>s+satirTop(k),0);
    const guncelle = () => {
      document.querySelectorAll('.kalem').forEach((el,i) => { el.querySelector('.k-top').textContent = '= ' + tl(satirTop(kalemler[i])) + ' ₺'; });
      $('#k-toplam').textContent = tl(toplam()) + ' ₺';
    };
    const ciz = () => {
      $('#kalemler').innerHTML = kalemler.map((k,i) => `
        <div class="kalem" data-i="${i}">
          <input class="k-ad" list="urunList" placeholder="Ürün / malzeme" value="${esc(k.ad)}" autocomplete="off" aria-label="Ürün">
          <div class="k-row">
            <input class="k-miktar num" inputmode="decimal" placeholder="Adet" value="${k.miktar===''?'':esc(typeof k.miktar==='number'?sayi(k.miktar):k.miktar)}" aria-label="Miktar">
            <span class="k-x">×</span>
            <input class="k-fiyat num" inputmode="decimal" placeholder="Birim ₺" value="${k.fiyat===''?'':esc(typeof k.fiyat==='number'?tl(k.fiyat):k.fiyat)}" aria-label="Birim fiyat">
            <span class="k-top num"></span>
            ${kalemler.length>1?`<button class="k-sil" aria-label="Kalemi sil">×</button>`:''}
          </div>
        </div>`).join('');
      document.querySelectorAll('.kalem').forEach(el => {
        const i = +el.dataset.i;
        el.querySelector('.k-ad').oninput = e => {
          kalemler[i].ad = e.target.value;
          const u = S.urunler.find(x => normAd(x.ad)===normAd(e.target.value));
          const fiyat = u && (t==='L' ? (u.alisFiyat ?? u.satisFiyat) : (u.satisFiyat ?? u.alisFiyat));
          if (u && fiyat!=null && String(kalemler[i].fiyat).trim()==='') {
            kalemler[i].fiyat = tl(fiyat); el.querySelector('.k-fiyat').value = tl(fiyat);
            if (String(kalemler[i].miktar).trim()==='') { kalemler[i].miktar = '1'; el.querySelector('.k-miktar').value = '1'; }
            guncelle(); el.querySelector('.k-miktar').select();
          }
        };
        el.querySelector('.k-miktar').oninput = e => { kalemler[i].miktar = e.target.value; guncelle(); };
        el.querySelector('.k-fiyat').oninput = e => { kalemler[i].fiyat = e.target.value; guncelle(); };
        const sil = el.querySelector('.k-sil'); if (sil) sil.onclick = () => { kalemler.splice(i,1); ciz(); };
      });
      guncelle();
    };
    if (grup==='mal') {
      ciz();
      document.querySelectorAll('.vade-chips button').forEach(b => b.onclick = () => {
        const g = +b.dataset.g; $('#f-vade').value = g ? gunEkle($('#f-tarih').value || today(), g) : '';
      });
      $('#k-ekle').onclick = () => { kalemler.push({ad:'', miktar:'', fiyat:''}); ciz(); const a=document.querySelectorAll('.k-ad'); a[a.length-1].focus(); };
      if (!h) document.querySelector('.k-ad').focus();
    } else if (!h) $('#f-tutar').focus();

    $('#f-cancel').onclick = close;
    $('#f-save').onclick = () => {
      const tarih = $('#f-tarih').value;
      if (!tarih) { $('#f-err').textContent='Tarih seçin.'; return; }
      let body;
      if (grup==='mal') {
        const dolu = kalemler.filter(k => String(k.ad).trim() || String(k.miktar).trim() || String(k.fiyat).trim());
        if (!dolu.length) { $('#f-err').textContent='En az bir kalem girin.'; return; }
        const temiz = [];
        for (const k of dolu) {
          const m = parseTL(k.miktar), f = parseTL(k.fiyat);
          if (!(m>0)) { $('#f-err').textContent=`“${k.ad||'Kalem'}” için adet / miktar yazın.`; return; }
          if (!(f>=0) || String(k.fiyat).trim()==='') { $('#f-err').textContent=`“${k.ad||'Kalem'}” için birim fiyat yazın.`; return; }
          temiz.push({ad:String(k.ad).trim(), miktar:m, fiyat:Math.round(f*100)/100});
        }
        const tutar = Math.round(temiz.reduce((s,k)=>s+k.miktar*k.fiyat,0)*100)/100;
        if (!(tutar>0)) { $('#f-err').textContent='Toplam sıfır olamaz.'; return; }
        const vade = $('#f-vade').value;
        if (vade && vade < tarih) { $('#f-err').textContent='Vade, işlem tarihinden önce olamaz.'; return; }
        body = { cariId, tur:t, tutar, kalemler:temiz, aciklama:$('#f-acik').value.trim(), tarih, vade };
        urunOgren(temiz, t);
      } else {
        const tutar = parseTL($('#f-tutar').value);
        if (!(tutar>0)) { $('#f-err').textContent='Sıfırdan büyük bir tutar yazın (örn. 1.250,50).'; return; }
        body = { cariId, tur:t, tutar:Math.round(tutar*100)/100, aciklama:$('#f-acik').value.trim(), tarih };
        if (h) delete h.kalemler;
      }
      if (h) Object.assign(h, body); else S.hareketler.push({id:uid(), ...body, olusturma:Date.now()});
      if (save()) { close(); toast('Kaydedildi'); }
    };
    if (h) $('#f-del').onclick = () => {
      $('#delWrap').innerHTML = `<button class="btn borc" id="f-del2" style="flex:1">Evet, bu hareketi sil</button>`;
      $('#f-del2').onclick = () => { S.hareketler = S.hareketler.filter(x=>x.id!==h.id); if (save()) { close(); toast('Silindi'); } };
    };
  });
}

// ---------- rapor
function raporSheet(bas, son){
  const bugun = today();
  if (!bas) { bas = bugun; son = bugun; }
  const pazartesi = (() => { const d = new Date(bugun+'T12:00:00'); const g = (d.getDay()+6)%7; d.setDate(d.getDate()-g); return d.toISOString().slice(0,10); })();
  const ayBasi = bugun.slice(0,8)+'01';
  const hs = S.hareketler.filter(h => h.tarih>=bas && h.tarih<=son);
  const top = {S:0,L:0,T:0,O:0};
  hs.forEach(h => { const k = ({B:'S',A:'T'})[h.tur]||h.tur; if (k in top) top[k]+=h.tutar; });
  const urunTop = {};
  hs.filter(h => ['S','B','L'].includes(h.tur)).forEach(h => (h.kalemler||[]).forEach(k => {
    const key = (h.tur==='L'?'L':'S') + '|' + (k.ad||'Adsız');
    urunTop[key] = urunTop[key] || {ad:k.ad||'Adsız', tur:h.tur==='L'?'Alış':'Satış', miktar:0, tutar:0};
    urunTop[key].miktar += k.miktar; urunTop[key].tutar += k.miktar*k.fiyat;
  }));
  const urunler = Object.values(urunTop).sort((a,b)=>b.tutar-a.tutar).slice(0,12);
  const cariAd = id => (S.cariler.find(c=>c.id===id)||{}).ad || 'Silinmiş cari';
  const secili = bas===bugun&&son===bugun ? 'gun' : bas===pazartesi&&son===bugun ? 'hafta' : bas===ayBasi&&son===bugun ? 'ay' : '';
  const kasa = top.T - top.O;
  sheet(`
    <h2>Rapor</h2>
    <div class="chips" style="margin-top:0">
      <button class="chip ${secili==='gun'?'on':''}" data-r="gun">Bugün</button>
      <button class="chip ${secili==='hafta'?'on':''}" data-r="hafta">Bu hafta</button>
      <button class="chip ${secili==='ay'?'on':''}" data-r="ay">Bu ay</button>
    </div>
    <div class="r-range"><label>Başlangıç<input type="date" id="r-bas" value="${bas}"></label><label>Bitiş<input type="date" id="r-son" value="${son}"></label></div>
    <div class="r-grid">
      <div><small>Satış</small><b class="num c-borc">${tl(top.S)} ₺</b></div>
      <div><small>Alış</small><b class="num c-alacak">${tl(top.L)} ₺</b></div>
      <div><small>Tahsilat (giren para)</small><b class="num">${tl(top.T)} ₺</b></div>
      <div><small>Ödeme (çıkan para)</small><b class="num">${tl(top.O)} ₺</b></div>
    </div>
    <div class="r-kasa"><span>Kasa farkı<br><small>giren − çıkan para</small></span><b class="num ${kasa<-0.004?'c-borc':kasa>0.004?'c-alacak':''}">${kasa<-0.004?'−':''}${tl(Math.abs(kasa))} ₺</b></div>
    ${urunler.length ? `<div class="r-h">Ürünler</div><div class="r-list">${urunler.map(u=>`<div><span>${esc(u.ad)} <small>${u.tur}</small></span><span class="num">${sayi(u.miktar)} adet · ${tl(u.tutar)} ₺</span></div>`).join('')}</div>` : ''}
    <div class="r-h">Hareketler (${hs.length})</div>
    <div class="r-list">${hs.length ? hs.slice().sort((a,b)=>a.tarih<b.tarih?1:-1).map(h=>`<div><span>${esc(cariAd(h.cariId))}<small>${trDate(h.tarih)} · ${tur(h).ad}</small></span><span class="num ${tur(h).renk}">${tl(h.tutar)} ₺</span></div>`).join('') : '<div class="empty" style="padding:14px">Bu tarihlerde hareket yok.</div>'}</div>
    <div class="actions"><button class="btn ghost" id="r-paylas">Raporu gönder</button><button class="btn" id="f-cancel">Kapat</button></div>`, close => {
    $('#f-cancel').onclick = close;
    document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
      const r = b.dataset.r; raporSheet(r==='gun'?bugun:r==='hafta'?pazartesi:ayBasi, bugun);
    });
    const yenile = () => { const a=$('#r-bas').value, b=$('#r-son').value; if (a && b) raporSheet(a<=b?a:b, a<=b?b:a); };
    $('#r-bas').onchange = yenile; $('#r-son').onchange = yenile;
    $('#r-paylas').onclick = () => {
      const l = [`Rapor ${trDate(bas)}${bas!==son?' – '+trDate(son):''}`, '', `Satış: ${tl(top.S)} ₺`, `Alış: ${tl(top.L)} ₺`, `Tahsilat: ${tl(top.T)} ₺`, `Ödeme: ${tl(top.O)} ₺`, `Kasa farkı: ${tl(kasa)} ₺`];
      if (urunler.length) { l.push('', 'Ürünler:'); urunler.forEach(u => l.push(`  ${u.ad} (${u.tur}): ${sayi(u.miktar)} adet, ${tl(u.tutar)} ₺`)); }
      paylas({text:l.join('\n'), title:'Rapor'});
    };
  });
}

// ---------- ürünler
function urunlerSheet(duzenle){
  const liste = S.urunler.slice().sort((a,b)=>(a.ad||'').localeCompare(b.ad||'','tr'));
  const u = duzenle ? S.urunler.find(x=>x.id===duzenle) : null;
  sheet(`
    <h2>${duzenle===undefined ? 'Ürünler' : u ? 'Ürünü düzenle' : 'Yeni ürün'}</h2>
    ${duzenle===undefined ? `
      <p>Satış veya alış girdiğiniz her ürün buraya kendiliğinden eklenir. Ürün adını yazınca son fiyatı gelir.</p>
      <div class="r-list">${liste.length ? liste.map(x=>`<button class="u-row" data-u="${esc(x.id)}"><span>${esc(x.ad)}</span><span class="num"><small>satış</small> ${x.satisFiyat!=null?tl(x.satisFiyat):'—'} · <small>alış</small> ${x.alisFiyat!=null?tl(x.alisFiyat):'—'}</span></button>`).join('') : '<div class="empty" style="padding:14px">Henüz ürün yok.</div>'}</div>
      <div class="actions"><button class="btn ghost" id="u-yeni">+ Ürün ekle</button><button class="btn" id="f-cancel">Kapat</button></div>`
    : `
      <label>Ürün adı<input id="u-ad" value="${esc(u?.ad)}" autocomplete="off"></label>
      <div class="r-range"><label>Satış fiyatı (₺)<input id="u-sf" inputmode="decimal" class="num" value="${u?.satisFiyat!=null?tl(u.satisFiyat):''}"></label><label>Alış fiyatı (₺)<input id="u-af" inputmode="decimal" class="num" value="${u?.alisFiyat!=null?tl(u.alisFiyat):''}"></label></div>
      <div class="err" id="f-err"></div>
      <div class="actions"><button class="btn ghost" id="u-geri">Geri</button><button class="btn" id="u-kaydet">Kaydet</button></div>
      ${u?`<div class="actions" id="delWrap"><button class="btn danger" id="u-sil">Ürünü sil</button></div>`:''}`}`, close => {
    if (duzenle===undefined) {
      $('#f-cancel').onclick = close;
      $('#u-yeni').onclick = () => urunlerSheet(null);
      document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => urunlerSheet(b.dataset.u));
      return;
    }
    if (!u) $('#u-ad').focus();
    $('#u-geri').onclick = () => urunlerSheet();
    $('#u-kaydet').onclick = () => {
      const ad = $('#u-ad').value.trim();
      if (!ad) { $('#f-err').textContent='Ürün adını yazın.'; return; }
      const ayni = S.urunler.find(x => normAd(x.ad)===normAd(ad) && x!==u);
      if (ayni) { $('#f-err').textContent='Bu adla bir ürün zaten var.'; return; }
      const oku = v => { v = v.trim(); if (!v) return null; const n = parseTL(v); return n>=0 ? Math.round(n*100)/100 : NaN; };
      const sf = oku($('#u-sf').value), af = oku($('#u-af').value);
      if (Number.isNaN(sf) || Number.isNaN(af)) { $('#f-err').textContent='Fiyatı rakamla yazın (örn. 20 veya 12,50).'; return; }
      const hedef = u || (S.urunler.push({id:uid()}), S.urunler[S.urunler.length-1]);
      Object.assign(hedef, {ad, satisFiyat:sf, alisFiyat:af, son:Date.now()});
      if (save()) { toast('Kaydedildi'); urunlerSheet(); }
    };
    if (u) $('#u-sil').onclick = () => {
      $('#delWrap').innerHTML = `<button class="btn borc" id="u-sil2" style="flex:1">Evet, ürünü sil</button>`;
      $('#u-sil2').onclick = () => { S.urunler = S.urunler.filter(x=>x!==u); if (save()) { toast('Ürün silindi'); urunlerSheet(); } };
    };
  });
}

// ---------- paylaşım / yedek
async function paylas({text, file, title}){
  try {
    if (file && navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title}); return 'ok'; }
    if (text && navigator.share) { await navigator.share({text, title}); return 'ok'; }
  } catch(e){ if (e && e.name==='AbortError') return 'iptal'; }
  if (file) { const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); return 'ok'; }
  try { await navigator.clipboard.writeText(text); toast('Ekstre kopyalandı'); return 'ok'; } catch(e){ return 'hata'; }
}

function ekstreGonder(c, rows){
  const lines = [`${c.ad} – Hesap Ekstresi (${trDate(today())})`, ''];
  rows.forEach(h => {
    lines.push(`${trDate(h.tarih)}  ${tur(h).ad}  ${tl(h.tutar)} ₺  ${h.aciklama||''}`.trim());
    (h.kalemler||[]).forEach(k => lines.push(`    ${k.ad||'Kalem'}: ${sayi(k.miktar)} × ${tl(k.fiyat)} = ${tl(k.miktar*k.fiyat)} ₺`));
  });
  const son = rows.length ? rows[rows.length-1].run : 0;
  lines.push('', `Güncel bakiye: ${tl(Math.abs(son))} ₺ ${son>0.004?'(borçlu)':son<-0.004?'(alacaklı)':'(kapalı)'}`);
  paylas({text: lines.join('\n'), title:'Ekstre'});
}

async function yedekAl(){
  const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const data = JSON.stringify({uygulama:'CariDefteri', surum:1, tarih:new Date().toISOString(), cariler:S.cariler, hareketler:S.hareketler, urunler:S.urunler}, null, 1);
  const file = new File([data], `cari-yedek-${stamp}.json`, {type:'application/json'});
  const r = await paylas({file, title:'Cari yedeği'});
  if (r==='ok') { S.sonYedek = Date.now(); save(); render(); toast('Yedek hazır. Dosyalar\'a veya WhatsApp\'a kaydedin.'); }
}

function yedekSheet(){
  const tarih = S.sonYedek ? new Date(S.sonYedek).toLocaleDateString('tr-TR') : 'hiç alınmadı';
  sheet(`
    <h2>Yedek</h2>
    <p>Kayıtlar yalnızca bu telefonda durur. Yedek dosyasını <b>Dosyalar</b>'a, iCloud'a veya kendinize WhatsApp ile gönderin. Telefon değişirse aynı dosyayı geri yükleyebilirsiniz.</p>
    <p>Son yedek: <b>${tarih}</b> · ${S.cariler.length} cari, ${S.hareketler.length} hareket</p>
    <button class="btn" id="b-al">Yedek al</button>
    <button class="btn ghost" id="b-yukle">Yedekten geri yükle</button>
    <div class="err" id="f-err"></div>
    <button class="btn ghost" id="f-cancel">Kapat</button>`, close => {
    $('#f-cancel').onclick = close;
    $('#b-al').onclick = async () => { await yedekAl(); };
    $('#b-yukle').onclick = () => { const f=$('#importFile'); f.value=''; f.onchange = () => yukleDosya(f.files[0], close); f.click(); };
  });
}

function yukleDosya(file, close){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch(e){ $('#f-err').textContent='Bu dosya bir Cari Defteri yedeği değil.'; return; }
    if (!d || !Array.isArray(d.cariler) || !Array.isArray(d.hareketler)) { $('#f-err').textContent='Bu dosya bir Cari Defteri yedeği değil.'; return; }
    const err = $('#f-err');
    err.innerHTML = `Yedekte ${d.cariler.length} cari, ${d.hareketler.length} hareket var. Şu anki kayıtların <b>yerine</b> geçecek.<br><button class="btn borc" id="b-onay" style="margin-top:8px;width:100%">Evet, geri yükle</button>`;
    $('#b-onay').onclick = () => { S.cariler=d.cariler; S.hareketler=d.hareketler; S.urunler=d.urunler||[]; S.view='list'; if (save()) { close(); toast('Yedek geri yüklendi'); } };
  };
  r.readAsText(file);
}

load();
if (!S.urunler.length && S.hareketler.some(h=>h.kalemler&&h.kalemler.length)) {
  S.hareketler.slice().sort((a,b)=>a.tarih<b.tarih?-1:1).forEach(h => { if (h.kalemler) urunOgren(h.kalemler, h.tur==='L'?'L':'S'); });
  save();
}
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
